name: Sync Wax Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync current Waxahachie Autoplex inventory
        run: node scripts/sync-inventory.mjs

      - name: Commit inventory changes
        run: |
          if git diff --quiet inventory.json; then
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "wax-inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inventory.json
          git commit -m "Update Waxahachie inventory"
          git push
